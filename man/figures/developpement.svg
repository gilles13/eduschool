<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="520" viewBox="0 0 2100 520" role="img" aria-labelledby="title desc">
<title id="title">Développement et publication</title>
<desc id="desc">Cycle de travail depuis une modification jusqu’au commit et à la publication pkgdown.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/></marker>

<style><![CDATA[
.edge { fill:none; stroke:#59636e; stroke-width:2.2; marker-end:url(#arrow); }
.edge-label { font:13px system-ui,sans-serif; fill:#4a5560; }
.node rect { stroke-width:1.8; rx:12; ry:12; }
.node text { font:15px system-ui,sans-serif; fill:#17212b; text-anchor:middle; dominant-baseline:middle; }
.normal rect { fill:#f7f9fb; stroke:#77828d; }.source rect,.niveau rect { fill:#eef5ff; stroke:#5e7fa7; }.database rect { fill:#f2f0ff; stroke:#7667a8; }.documentation rect,.serie rect { fill:#fff6e8; stroke:#a77b3f; }.accent rect,.voie rect { fill:#eaf8f0; stroke:#4f8b68; }.sortie rect { fill:#f4f7ea; stroke:#788d49; }
.group rect { stroke-width:1.5; stroke-dasharray:7 5; rx:18; ry:18; }.group-title { font:600 15px system-ui,sans-serif; fill:#34404b; }.cycle3 rect { fill:#f5f9ff; stroke:#91a9c5; }.cycle4 rect { fill:#f4faf6; stroke:#88aa94; }.cycle_terminal rect { fill:#fffaf0; stroke:#b89a68; }
]]></style>
</defs>
<rect x="0" y="0" width="100%" height="100%" fill="white"/>
<path class="edge" d="M 250 236 L 275 236 L 275 236 L 300 236"/>
<path class="edge" d="M 520 236 L 540 236 L 540 236 L 560 236"/>
<path class="edge" d="M 750 236 L 785 236 L 785 236 L 820 236"/>
<path class="edge" d="M 1000 236 L 1040 236 L 1040 126 L 1080 126"/>
<path class="edge" d="M 1175 162 L 1175 236 L 1175 236 L 1175 310"/>
<path class="edge" d="M 1270 126 L 1305 126 L 1305 236 L 1340 236"/>
<path class="edge" d="M 1270 346 L 1305 346 L 1305 236 L 1340 236"/>
<path class="edge" d="M 1530 236 L 1565 236 L 1565 236 L 1600 236"/>
<path class="edge" d="M 1810 236 L 1835 236 L 1835 236 L 1860 236"/>
<g class="node source" id="BR">
<rect x="40" y="200" width="210" height="72" rx="14" ry="14"/>
<text x="145" y="226.5">Branche de</text>
<text x="145" y="245.5">fonctionnalité</text>
</g>
<g class="node normal" id="PATCH">
<rect x="300" y="200" width="220" height="72" rx="14" ry="14"/>
<text x="410" y="236">Patch / modification</text>
</g>
<g class="node normal" id="LOAD">
<rect x="560" y="200" width="190" height="72" rx="14" ry="14"/>
<text x="655" y="236">load_all()</text>
</g>
<g class="node accent" id="TEST">
<rect x="820" y="200" width="180" height="72" rx="14" ry="14"/>
<text x="910" y="236">Tests</text>
</g>
<g class="node normal" id="CHECK">
<rect x="1080" y="90" width="190" height="72" rx="14" ry="14"/>
<text x="1175" y="126">R CMD check</text>
</g>
<g class="node documentation" id="SVG">
<rect x="1080" y="310" width="190" height="72" rx="14" ry="14"/>
<text x="1175" y="336.5">SVG et</text>
<text x="1175" y="355.5">vignettes</text>
</g>
<g class="node documentation" id="PKG">
<rect x="1340" y="200" width="190" height="72" rx="14" ry="14"/>
<text x="1435" y="236">pkgdown</text>
</g>
<g class="node sortie" id="COMMIT">
<rect x="1600" y="200" width="210" height="72" rx="14" ry="14"/>
