<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1590" height="520" viewBox="0 0 1590 520" role="img" aria-labelledby="title desc">
  <title id="title">Programmes, capacités et notions</title>
  <desc id="desc">Relations entre programmes, capacités, notions, rappels et exercices.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/>
    </marker>
    <style><![CDATA[
