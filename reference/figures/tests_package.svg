<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="900" viewBox="0 0 860 900" role="img" aria-labelledby="title desc">
  <title id="title">Chaîne de contrôle et de test du package</title>
  <desc id="desc">Contrôles des données, tests unitaires, construction du package et documentation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/>
    </marker>
    <style><![CDATA[
      .edge { fill: none; stroke: #59636e; stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-label { font: 13px system-ui, sans-serif; fill: #4a5560; }
      .node rect { stroke-width: 1.8; }
      .node text { font: 15px system-ui, sans-serif; fill: #17212b; text-anchor: middle; dominant-baseline: middle; }
      .normal rect { fill: #f7f9fb; stroke: #77828d; }
      .source rect { fill: #eef5ff; stroke: #5e7fa7; }
      .database rect { fill: #f2f0ff; stroke: #7667a8; }
      .documentation rect { fill: #fff6e8; stroke: #a77b3f; }
      .accent rect { fill: #eaf8f0; stroke: #4f8b68; }
      .sortie rect { fill: #f4f7ea; stroke: #788d49; }
      .niveau rect { fill: #eef5ff; stroke: #5e7fa7; }
      .voie rect { fill: #eaf8f0; stroke: #4f8b68; }
      .serie rect { fill: #fff6e8; stroke: #a77b3f; }
      .group rect { stroke-width: 1.5; stroke-dasharray: 7 5; rx: 18; ry: 18; }
      .group-title { font: 600 15px system-ui, sans-serif; fill: #34404b; }
      .cycle3 rect { fill: #f5f9ff; stroke: #91a9c5; }
      .cycle4 rect { fill: #f4faf6; stroke: #88aa94; }
      .cycle_terminal rect { fill: #fffaf0; stroke: #b89a68; }
    ]]></style>
  </defs>
  <rect x="0" y="0" width="100%" height="100%" fill="white"/>
  <path class="edge" d="M 420 107 L 420 131 L 430 131 L 430 155"/>
  <path class="edge" d="M 430 227 L 430 251 L 420 251 L 420 275"/>
  <path class="edge" d="M 420 347 L 420 371 L 425 371 L 425 395"/>
  <path class="edge" d="M 425 467 L 425 491 L 425 491 L 425 515"/>
  <path class="edge" d="M 425 587 L 425 611 L 435 611 L 435 635"/>
  <path class="edge" d="M 435 707 L 435 731 L 420 731 L 420 755"/>
  <g class="node source" id="MOD">
    <rect x="310" y="35" width="220" height="72" rx="18" ry="18"/>
    <text x="420" y="71">Modification</text>
  </g>
  <g class="node normal" id="LOAD">
    <rect x="310" y="155" width="240" height="72" rx="18" ry="18"/>
    <text x="430" y="191">devtools::load_all()</text>
  </g>
  <g class="node normal" id="DATA">
    <rect x="310" y="275" width="220" height="72" rx="18" ry="18"/>
    <text x="420" y="301.5">Contrôles de</text>
    <text x="420" y="320.5">cohérence</text>
  </g>
  <g class="node accent" id="TEST">
    <rect x="310" y="395" width="230" height="72" rx="18" ry="18"/>
    <text x="425" y="431">devtools::test()</text>
  </g>
  <g class="node normal" id="CHECK">
    <rect x="310" y="515" width="230" height="72" rx="18" ry="18"/>
    <text x="425" y="551">devtools::check()</text>
  </g>
  <g class="node documentation" id="DOC">
    <rect x="310" y="635" width="250" height="72" rx="18" ry="18"/>
    <text x="435" y="671">pkgdown::build_site()</text>
  </g>
  <g class="node sortie" id="COMMIT">
    <rect x="310" y="755" width="220" height="72" rx="18" ry="18"/>
    <text x="420" y="791">Commit / push</text>
  </g>
</svg>
